name: Auto-update news (Šalin rankas)

on:
  schedule:
    - cron: "0 */6 * * *"   # kas 6 val. (UTC)
  workflow_dispatch:        # paleidimas rankiniu būdu per UI

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil

      - name: Run updater
        run: |
          python tools/update_news.py

      - name: Detect changes in index.html
        id: diff
        run: |
          if git diff --quiet --exit-code index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch, commit, push
        if: steps.diff.outputs.changed == 'true'
        env:
          TZ: Europe/Vilnius
        run: |
          BRANCH="auto/news-$(date +'%Y%m%d%H%M')"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add index.html
          git commit -m "chore(news): auto-update naujienų kortelės (Šalin rankas)"
          git push -u origin "$BRANCH"

      - name: Open PR with github-script
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.BRANCH;
            const title  = "Auto: atnaujintos naujienų kortelės (Šalin rankas)";
            const body   = [
              "Šis PR automatiškai atnaujina naujienų korteles pagal stebimus šaltinius.",
              "",
              "Pastaba: jei reikia, redaguokite `tools/update_news.py` → SOURCES/KEYWORDS.",
              `Sugeneruota: ${new Date().toISOString()}`
            ].join("\n");

            // jeigu egzistuoja PR iš to paties branch – nesikartoti
            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              head:  `${context.repo.owner}:${branch}`
            });
            if (openPRs.length === 0) {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title,
                head:  branch,
                base:  'main',
                body
              });
              core.info(`Sukurtas PR: #${pr.data.number}`);
            } else {
              core.info(`PR jau egzistuoja: #${openPRs[0].number}`);
            }